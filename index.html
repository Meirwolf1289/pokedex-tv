<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Laid out on a 1920x1080 canvas (tvOS points @1x, safe area 90/60) and scaled to the screen. */
  :root {
    --icon-w: 256px; --icon-h: 154px; --gap: 40px; --radius: 14px;
    --ink: #fff; --ink-2: rgba(255,255,255,.62); --ink-3: rgba(255,255,255,.4);
    --tint: #335;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: Nunito, -apple-system, "Helvetica Neue", Roboto, system-ui, sans-serif; font-feature-settings: "tnum";
    color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: none;
  }
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1)); transform-origin: center; overflow: hidden;
  }

  /* Background: near-black, with a wash from the focused app capped at 12%. */
  .bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, #0b0b10 0%, #15161c 100%); }
  .bg video { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s; filter: brightness(.45) saturate(1.1); }
  .bg video.on { opacity: 1; }
  body.idle .bg video { filter: none; }
  .bg .wash {
    position: absolute; top: -20%; right: -20%; bottom: -20%; left: -20%; opacity: .12; filter: blur(80px);
    background: radial-gradient(50% 45% at 50% 30%, var(--tint) 0%, transparent 70%);
  }

  /* Top bar: Liquid Glass strip, small clock and avatar on the right. */
  .topbar {
    position: absolute; left: 90px; right: 90px; top: 28px; height: 52px; z-index: 5;
    display: flex; align-items: center; gap: 14px;
  }
  .topbar .greet { font-size: 34px; font-weight: 600; letter-spacing: -.02em; margin-right: auto; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  .pill {
    height: 52px; min-width: 52px; padding: 0 20px; border-radius: 26px; display: flex; align-items: center; gap: 10px;
    font-size: 24px; font-weight: 500; color: rgba(255,255,255,.9); font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35); position: relative; overflow: hidden;
    transition: transform .18s ease-out, background .18s, box-shadow .18s;
  }
  .pill svg { width: 26px; height: 26px; fill: currentColor; }
  .pill.is-focused { transform: scale(1.08); background: rgba(255,255,255,.22); box-shadow: 0 16px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5); }
  .pill.off { color: rgba(255,255,255,.45); }
  /* Clock panel: full time and date under the clock pill. */
  .clockpanel {
    position: absolute; right: 90px; top: 96px; width: 460px; padding: 30px 36px; border-radius: 28px; z-index: 6;
    background: rgba(28,28,30,.6); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(40px) saturate(1.4); backdrop-filter: blur(40px) saturate(1.4);
    box-shadow: 0 30px 80px rgba(0,0,0,.55); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .2s, transform .2s;
  }
  body.clock-open .clockpanel { opacity: 1; transform: none; }
  .clockpanel .big { font-size: 96px; font-weight: 300; letter-spacing: -.03em; line-height: 1; }
  .clockpanel .small { font-size: 26px; color: var(--ink-2); margin-top: 10px; }
  /* Shine sweep: one diagonal pass when focus lands. */
  .sweep::before {
    content: ""; position: absolute; top: -50%; bottom: -50%; left: -60%; width: 40%; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 100%);
    transform: translateX(-100%) skewX(-12deg); animation: sweep .55s ease-out 1;
  }
  @keyframes sweep { to { transform: translateX(450%) skewX(-12deg) } }
  .saver .where { position: absolute; left: 90px; bottom: 60px; font-size: 36px; font-weight: 500; text-shadow: 0 2px 20px rgba(0,0,0,.6); }

  /* Top shelf: the focused dock app's content, upper half of the screen. */
  .shelf { position: absolute; left: 90px; right: 90px; top: 100px; height: 560px; transition: opacity .3s; }
  .shelf .art {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 28px; overflow: hidden;
    background: linear-gradient(120deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.7) 100%), var(--tint);
    box-shadow: 0 30px 80px rgba(0,0,0,.5); transition: background .6s;
  }
  .shelf .art::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(45% 80% at 80% 15%, rgba(255,255,255,.28), transparent 60%); }
  .shelf .art svg { position: absolute; right: 70px; bottom: -70px; width: 420px; height: 420px; fill: rgba(255,255,255,.16); }
  .shelf .copy { position: absolute; left: 60px; bottom: 54px; }
  .shelf h1 { font-size: 64px; font-weight: 700; letter-spacing: -.02em; text-shadow: 0 2px 30px rgba(0,0,0,.5); }
  .shelf p  { font-size: 28px; color: var(--ink-2); margin-top: 8px; }
  body.scrolled .shelf { opacity: 0; }
  /* TMDB carousel: two stacked backdrops cross-fade; the copy sits on a bottom gradient. */
  .shelf .slides { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 28px; overflow: hidden; display: none; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  body.has-slides .shelf .slides { display: block; }
  body.has-slides .shelf .art { opacity: 1; }
  body.has-slides .shelf .art .copy, body.has-slides .shelf .art svg { display: none; }
  .shelf .slides { z-index: 1; } .shelf .art .mon { z-index: 2; pointer-events: none; } .shelf .art .badge { z-index: 2; }
  .shelf .slides > img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }
  .shelf .slides > img.on { opacity: 1; }
  .shelf .slides .fade { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.75) 100%); }
  .shelf .slides .copy { bottom: 44px; max-width: 1100px; }
  .shelf .slides .meta { font-size: 24px; color: var(--ink-2); margin-top: 10px; display: flex; gap: 18px; }
  .shelf .slides .meta .star { color: #ffd60a; }
  .shelf .dots { position: absolute; right: 50px; bottom: 44px; display: flex; gap: 10px; }
  .shelf .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.35); transition: background .3s, transform .3s; }
  .shelf .dots i.on { background: #fff; transform: scale(1.3); }
  .shelf .slides .cta {
    position: absolute; right: 50px; top: 40px; padding: 14px 26px; border-radius: 999px; font-size: 24px; font-weight: 600;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); opacity: 0; transition: opacity .2s;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  body.zone-shelf .shelf .slides .cta { opacity: 1; }
  body.zone-shelf .shelf .slides { box-shadow: 0 24px 48px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.9); }
  .shelf .note { position: absolute; left: 60px; bottom: 54px; font-size: 26px; color: var(--ink-3); display: none; max-width: 1200px; line-height: 1.4; }
  body.has-note .shelf .note { display: block; }
  body.has-note .shelf .art .copy { display: none; }

  /* Settings: one glass sheet with the TMDB key and the region. */
  .sheet {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); width: 900px; padding: 48px 56px;
    border-radius: 32px; background: rgba(28,28,30,.72); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(40px) saturate(1.4); backdrop-filter: blur(40px) saturate(1.4);
    box-shadow: 0 40px 120px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 8;
  }
  body.settings .sheet { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .sheet h2 { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .sheet p { font-size: 24px; color: var(--ink-2); margin-top: 10px; line-height: 1.4; }
  .sheet label { display: block; margin-top: 32px; font-size: 22px; color: var(--ink-2); }
  .sheet input {
    display: block; width: 100%; margin-top: 10px; height: 64px; padding: 0 22px; border-radius: 16px; font: inherit; font-size: 26px; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); outline: 0;
  }
  .sheet input:focus { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.6); }
  .sheet .foot { margin-top: 28px; font-size: 22px; color: var(--ink-3); }

  /* Rows: the dock (row 1) and the rest. */
  .rows { position: absolute; left: 90px; right: 90px; top: 720px; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  body.scrolled .rows { transform: translateY(-620px); }
  .row { display: flex; gap: var(--gap); margin-bottom: 86px; position: relative; }
  /* Dock edge: the Liquid Glass hairline tvOS 26 added. */
  .row.dock::before {
    content: ""; position: absolute; top: -22px; right: -26px; bottom: -22px; left: -26px; border-radius: 30px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.04) 100%);
    border: 1px solid rgba(255,255,255,.12); border-top-color: rgba(255,255,255,.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 20px 50px rgba(0,0,0,.35);
  }

  .icon {
    position: relative; width: var(--icon-w); height: var(--icon-h);
    border-radius: var(--radius); transform-style: preserve-3d;
    transition: transform .22s ease-out, box-shadow .22s ease-out;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  .icon .clip { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; overflow: hidden; }
  .icon .layer { position: absolute; top: -6%; right: -6%; bottom: -6%; left: -6%; display: grid; place-items: center; transition: transform .22s ease-out; }
  .icon .layer.back { background: var(--bg); }
  .icon .layer.back::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(110deg, rgba(255,255,255,.12) 0%, transparent 45%, rgba(0,0,0,.18) 100%); }
  .icon .layer.front svg { width: 96px; height: 96px; fill: #fff; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
  .icon .word { font-size: 46px; font-weight: 800; letter-spacing: -.03em; color: #fff; }
  .icon .shine { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity .18s;
    background: radial-gradient(60% 60% at calc(50% + var(--ty, 0) * 4%) calc(30% - var(--tx, 0) * 4%), rgba(255,255,255,.18), transparent 70%); }
  .icon .edge { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .18s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.12); }
  .icon .label {
    position: absolute; top: 100%; left: -40px; right: -40px; text-align: center; margin-top: 12px;
    font-size: 30px; font-weight: 500; color: rgba(255,255,255,.9); opacity: 0; transform: translateY(4px);
    transition: opacity .15s, transform .15s;
  }
  .icon.is-focused {
    transform: scale(1.10) rotateX(calc(var(--tx, 0) * 1deg)) rotateY(calc(var(--ty, 0) * 1deg));
    box-shadow: 0 24px 48px rgba(0,0,0,.55); z-index: 2;
  }
  .icon.is-focused .shine, .icon.is-focused .edge { opacity: 1; }
  .icon.is-focused .label { opacity: 1; transform: none; }
  /* Parallax: back 0, front 8px against the tilt, front +2%. */
  .icon.is-focused .layer.front { transform: translate(calc(var(--ty, 0) * -1.33px), calc(var(--tx, 0) * 1.33px)) scale(1.02); }
  /* Idle sway after 1.5 s without input. */
  .icon.is-focused.sway { animation: sway 6s ease-in-out infinite; }
  @keyframes sway {
    0%   { transform: scale(1.10) rotateX(0deg)  rotateY(-2deg) }
    25%  { transform: scale(1.10) rotateX(2deg)  rotateY(0deg) }
    50%  { transform: scale(1.10) rotateX(0deg)  rotateY(2deg) }
    75%  { transform: scale(1.10) rotateX(-2deg) rotateY(0deg) }
    100% { transform: scale(1.10) rotateX(0deg)  rotateY(-2deg) }
  }
  .icon.pressed { transform: scale(.96) !important; transition-duration: .12s; }
  body.arranging .icon.is-focused { animation: jiggle .3s ease-in-out infinite alternate; }
  @keyframes jiggle { from { transform: scale(1.10) rotate(-1.2deg) } to { transform: scale(1.10) rotate(1.2deg) } }

  /* Idle: the clock screensaver (Portraits-style). */
  .saver { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-content: center; text-align: center; z-index: 9;
    background: radial-gradient(80% 70% at 50% 100%, #1b2550 0%, #05060f 70%); opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  body.idle.video .saver { background: none; }
  body.idle.video .saver .time, body.idle.video .saver .date { display: none; }
  body.idle .stage > :not(.bg):not(.saver) { opacity: 0; transition: opacity 1s; }
  body.idle .saver { opacity: 1; }
  .saver .time { font-size: 300px; font-weight: 200; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .saver .date { margin-top: 20px; font-size: 36px; color: var(--ink-2); }

  .hint { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: var(--ink-3); font-size: 28px; opacity: 0; transition: opacity .3s; }
  body.arranging .hint { opacity: 1; }
  /* TV mode: the TV's web runtime is a small GPU. No backdrop blur, no filter on the video, no perpetual motion;
     the aerials play only as the screensaver, the home sits on a flat gradient. */
  body.tv .bg video { filter: none; opacity: 0; }
  body.tv.idle .bg video.on { opacity: 1; }
  body.tv .bg .wash { filter: none; opacity: .18; }
  body.tv .topbar .pill, body.tv .row.dock::before, body.tv .sheet, body.tv .clockpanel, body.tv .slides .cta {
    -webkit-backdrop-filter: none; backdrop-filter: none; }
  body.tv .pill { background: rgba(60,60,66,.75); }
  body.tv .row.dock::before { background: rgba(255,255,255,.06); box-shadow: none; }
  body.tv .sheet, body.tv .clockpanel { background: rgba(28,28,30,.96); }
  body.tv .icon.is-focused.sway { animation: none; }
  body.tv .icon { box-shadow: none; }
  body.tv .icon.is-focused { box-shadow: 0 16px 32px rgba(0,0,0,.5); }
  body.tv .shelf .art, body.tv .shelf .slides { box-shadow: none; }
  body.tv .sweep::before { animation: none; }
  /* Flat and 2D on a TV: one short transform transition, nothing else animates (shadows, backgrounds, layers). */
  body.tv .icon { transform-style: flat; transition: transform .15s ease-out; will-change: transform; box-shadow: none; }
  body.tv .icon.is-focused { transform: scale(1.1); box-shadow: none; outline: 4px solid rgba(255,255,255,.9); outline-offset: 0; }
  body.tv .icon .layer, body.tv .icon .shine, body.tv .icon .edge, body.tv .icon .label { transition: none; }
  body.tv .icon.is-focused .layer.front { transform: none; }
  body.tv .icon .layer.back::after { display: none; }
  body.tv .icon .shine { display: none; }
  body.tv .icon .layer.front svg { filter: none; }
  body.tv .rows { transition: transform .2s ease-out; will-change: transform; }
  body.tv .shelf, body.tv .shelf .art, body.tv .shelf .slides img, body.tv .pill, body.tv .pick { transition: none; }
  body.tv .shelf .art::before { display: none; }
  body.tv .shelf h1, body.tv .topbar .greet, body.tv .saver .where { text-shadow: none; }
  body.tv .bg .wash { display: none; }
  body.tv .stage { will-change: auto; }
  @media (prefers-reduced-motion: reduce) { .icon, .rows, .shelf, .layer { transition: none } .icon.is-focused.sway, body.arranging .icon.is-focused { animation: none } }
</style>

<style id="pokedex">
  /* ---- Partner skin: every app has a Pokémon partner. Bright, rounded, flat — it runs on a TV GPU. */
  :root { --ink: #fff; --ink-2: rgba(255,255,255,.72); --ink-3: rgba(255,255,255,.5); --type: #78c850; --night: #121a3d; }
  body { color: var(--ink); }
  /* dusk: dark enough for white type on a TV, with the GO neon at the horizon */
  .bg { background: linear-gradient(180deg, #0f1636 0%, #1d2460 45%, #4b2a8a 80%, #c75d9c 100%); }
  .bg .wash { display: none; }
  .bg .blob { position: absolute; border-radius: 50%; background: rgba(120,160,255,.14); }
  .bg .blob.a { width: 1100px; height: 1100px; left: -400px; top: -600px; }
  .bg .blob.b { width: 800px; height: 800px; right: -300px; top: 200px; background: rgba(255,120,200,.12); }
  .bg .blob.c { width: 520px; height: 520px; left: 38%; bottom: -300px; background: rgba(255,200,120,.12); }
  .topbar { left: 90px; right: 90px; top: 30px; }
  .topbar .mark { display: flex; align-items: center; gap: 14px; margin-right: 26px; font-size: 26px; font-weight: 900; letter-spacing: .02em; color: #fff; }
  .topbar .mark .ball { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #ff3b4a 0 46%, #15172b 46% 54%, #fff 54%); position: relative; box-shadow: 0 0 0 3px #15172b; }
  .topbar .mark .ball::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #15172b; }
  .topbar .greet { font-size: 30px; font-weight: 700; color: var(--ink-2); margin-right: auto; }
  .pill { border-radius: 999px; border: 0; background: rgba(255,255,255,.14); color: #fff; box-shadow: none; font-weight: 800; }
  .pill.is-focused { background: #fff; color: var(--night); transform: scale(1.08); box-shadow: 0 10px 24px rgba(0,0,0,.3); }
  .clockpanel { border-radius: 28px; border: 0; background: #fff; color: var(--night); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .clockpanel .big { font-weight: 900; } .clockpanel .small { color: rgba(18,26,61,.65); }
  /* the Top Shelf: the partner card */
  .shelf { left: 90px; right: 90px; top: 120px; height: 560px; }
  .shelf .art, .shelf .slides { border-radius: 40px; border: 0; box-shadow: 0 24px 60px rgba(0,0,0,.18);
    background: linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 55%, rgba(0,0,0,.18) 100%), var(--type); }
  .shelf .art::before { display: none; }
  .shelf .art svg { display: none; }
  .shelf .mon { position: absolute; right: 80px; bottom: -30px; width: 560px; height: 560px; object-fit: contain; }
  .shelf .mon-ring { position: absolute; right: 120px; top: 40px; width: 480px; height: 480px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .shelf .copy { left: 70px; bottom: 70px; }
  .shelf h1 { font-size: 92px; font-weight: 900; letter-spacing: -.03em; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.12); line-height: 1; }
  .shelf p { font-size: 30px; font-weight: 700; color: rgba(255,255,255,.9); margin-top: 14px; }
  .shelf .badge { position: absolute; left: 70px; top: 60px; display: flex; gap: 14px; align-items: center; }
  .shelf .badge b { background: rgba(255,255,255,.9); color: var(--night); padding: 12px 22px; border-radius: 999px; font-weight: 900; font-size: 22px; letter-spacing: .06em; }
  .shelf .badge .hp { font-size: 22px; font-weight: 800; color: #fff; background: rgba(0,0,0,.18); padding: 12px 22px; border-radius: 999px; }
  .shelf .badge .partner { font-size: 22px; font-weight: 800; color: rgba(255,255,255,.95); }
  .shelf .note { color: #fff; font-weight: 700; font-size: 26px; left: 70px; bottom: 70px; max-width: 1000px; }
  .shelf .slides .copy h1 { font-size: 64px; }
  .shelf .slides .meta { color: rgba(255,255,255,.9); font-weight: 700; } .shelf .slides .meta .star { color: #ffd60a; }
  .shelf .slides .cta { border: 0; background: #fff; color: var(--night); font-weight: 900; }
  /* what is on: the picked title on the left, five posters on the right, the partner as a small avatar */
  .shelf .posters { position: absolute; right: 70px; top: 190px; height: 270px; display: flex; gap: 24px; align-items: flex-start; }
  .shelf .poster { flex: none; width: 180px; height: 270px; margin: 0; position: relative; border-radius: 16px; background: rgba(0,0,0,.25); box-shadow: 0 10px 24px rgba(0,0,0,.35); transition: transform .2s ease-out, box-shadow .2s; }
  .shelf .poster img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; }
  .shelf .poster figcaption { display: none; }
  .shelf .poster.on { transform: translateY(-16px) scale(1.06); z-index: 2; box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 0 5px #fff; }
  .shelf .dots { display: none; }
  body.has-slides .shelf .copy { left: 70px; right: auto; top: 150px; bottom: auto; width: 560px; }
  body.has-slides .shelf h1 { font-size: 46px; line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  body.has-slides .shelf .slides .meta { font-size: 22px; margin-top: 12px; }

  function cached(key, make) {
    var c = panelCache[key];
    if (c && Date.now() - c.at < 600e3) return Promise.resolve(c.v);
    return make().then(function (v) { panelCache[key] = { at: Date.now(), v: v }; return v; });
  }
  // The feed goes through rss2json (Google News sends no CORS header); markets are CoinGecko + Frankfurter, both open.
  function ago(d) {
    var t = Date.parse(String(d).replace(' ', 'T')); if (isNaN(t)) t = Date.parse(d); if (isNaN(t)) return '';
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    return ' · ' + (m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago');
  }
  function newsItems() {
    return cached('news:' + feedUrl(), function () {
      return fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl()))
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(function (d) {
          if (d.status !== 'ok') throw new Error(d.message || 'feed error');
          return d.items.slice(0, 4).map(function (it) {
            var m = String(it.title).match(/^(.*)\s+-\s+([^-]+)$/);
            return { text: m ? m[1] : it.title, sub: (m ? m[2] : '') + ago(it.pubDate), q: '' };
          });
        });
    });
  }
  function quoteItems() {
    var want = symbols(), coins = [], fx = [];
    var ids = { BTC: 'bitcoin', ETH: 'ethereum', SOL: 'solana', XRP: 'ripple', DOGE: 'dogecoin', ADA: 'cardano', BNB: 'binancecoin', LTC: 'litecoin', TON: 'the-open-network', AVAX: 'avalanche-2' };
    var FX = /^(ILS|EUR|GBP|JPY|CHF|CAD|AUD|NZD|SEK|NOK|DKK|PLN|CZK|HUF|TRY|ZAR|MXN|BRL|INR|CNY|HKD|SGD|KRW|THB|RON|BGN|ISK|IDR|MYR|PHP)$/i;
    want.forEach(function (x) { (FX.test(x) && !ids[x.toUpperCase()] ? fx : coins).push(x); });
    return cached('markets:' + want.join(','), function () {
      var coinIds = coins.map(function (c) { return ids[c.toUpperCase()] || c.toLowerCase(); });
      var pCoins = coinIds.length ? fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + coinIds.join(',') + '&vs_currencies=usd&include_24hr_change=true')
        .then(function (r) { return r.json(); }) : Promise.resolve({});
      var pFx = fx.length ? fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=' + fx.join(',')).then(function (r) { return r.json(); }) : Promise.resolve({ rates: {} });
      return Promise.all([pCoins, pFx]).then(function (r) {
        var out = [];
        coins.forEach(function (c, i) {
          var d = r[0][coinIds[i]];
          if (!d) return out.push({ text: c, q: '—' });
          var ch = d.usd_24h_change || 0;
          out.push({ text: c.toUpperCase(), sub: 'US dollars · 24 h', q: '$' + d.usd.toLocaleString(undefined, { maximumFractionDigits: 2 }) + '  ' + (ch >= 0 ? '▲' : '▼') + Math.abs(ch).toFixed(2) + '%', dir: ch >= 0 ? 'up' : 'down' });
        });
        fx.forEach(function (c) { var v = r[1].rates && r[1].rates[c]; out.push({ text: 'USD → ' + c.toUpperCase(), sub: 'ECB reference rate', q: v ? v.toFixed(3) : '—' }); });
        return out;
      });
    });
  }
  function showPanel(a) {
    var title = document.getElementById('panel-title'), list = document.getElementById('panel-list'), foot = document.getElementById('panel-foot');
    document.body.classList.toggle('has-panel', !!a.panel);
    if (!a.panel) { document.getElementById('shelf-upd').textContent = ''; return; }
    document.getElementById('panel').className = 'panel ' + a.panel;
    list.innerHTML = '<li><span class="t"><b>Loading…</b></span></li>'; document.getElementById('shelf-upd').textContent = '';
    var seq = ++fetchSeq;
    (a.panel === 'news' ? newsItems() : quoteItems()).then(function (items) {
      if (seq !== fetchSeq) return;
      list.innerHTML = items.map(function (it, i) {
        return '<li>' + (a.panel === 'news' ? '<span class="n">' + (i + 1) + '</span>' : '') +
          '<span class="t"><b>' + esc(it.text) + '</b>' + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>' +
          (it.q ? '<span class="q ' + (it.dir || '') + '">' + esc(it.q) + '</span>' : '') + '</li>';
      }).join('') || '<li><span class="t"><b>Nothing came back.</b></span></li>';
      document.getElementById('shelf-upd').textContent = (a.panel === 'news' ? 'Google News' : 'CoinGecko · ECB') + ' · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · OK refreshes';
    }).catch(function (e) { if (seq === fetchSeq) list.innerHTML = '<li><span class="t"><b>Could not load: ' + esc(e && e.message || e) + '</b></span></li>'; });
  }
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function note(t) { document.getElementById('note').textContent = t || ''; document.body.classList.toggle('has-note', !!t); }
  function loadShelf(a) {
    clearTimeout(slideTimer); slides = [];
    document.body.classList.remove('has-slides');
    showPanel(a);
    if (!a.provider && !a.trending) { note(''); return; }
    if (!tmdbKey()) { note('Open Settings and paste a TMDB key to see what is on ' + a.name + '.'); return; }
    note('Loading what is on ' + a.name + '…');
    var seq = ++fetchSeq;
    listFor(a).then(function (items) {
      if (seq !== fetchSeq) return; // focus moved on
      if (!items.length) { note('Nothing found for ' + a.name + ' in ' + region() + '.'); return; }
      note(''); slides = items; slide = 0; showSlide(true);
      items.slice(1, 4).forEach(function (s) { new Image().src = s.backdrop; }); // warm the next few
      document.body.classList.add('has-slides');
    }).catch(function (e) {
      if (seq !== fetchSeq) return;
      note(e.message === 'key' ? 'TMDB refused the key. Open Settings and check it.' : 'TMDB did not answer: ' + (e && e.message || e));
    });
  }
  function showSlide(first) {
    var s = slides[slide]; if (!s) return;
    var box = document.getElementById('posters');
    if (first || box.children.length !== slides.length) {
      box.innerHTML = slides.map(function (x, i) { return '<figure class="poster' + (i === slide ? ' on' : '') + '"><img alt="" src="' + x.poster + '"><figcaption>' + esc(x.title) + '</figcaption></figure>'; }).join('');
    } else {
      for (var i = 0; i < box.children.length; i++) box.children[i].classList.toggle('on', i === slide);
    }
    document.getElementById('s-title').textContent = s.title;
    document.getElementById('s-meta').innerHTML = '<span>' + s.kind + '</span><span>' + s.year + '</span>' + (s.rating ? '<span class="star">★ ' + s.rating + '</span>' : '');
    document.getElementById('cta').textContent = 'Open in ' + app(order[focus]).name;
    document.getElementById('shelf-hp').textContent = 'HP ' + (s.rating ? Math.round(parseFloat(s.rating) * 10) : 50);
    document.getElementById('dots').innerHTML = slides.map(function (_, i) { return '<i class="' + (i === slide ? 'on' : '') + '"></i>'; }).join('');
    clearTimeout(slideTimer);
    slideTimer = setTimeout(function () { slide = (slide + 1) % slides.length; showSlide(); }, SLIDE_MS);
  }
  function stepSlide(d) { if (!slides.length) return; tick(); slide = (slide + d + slides.length) % slides.length; showSlide(); }

  // ---- Settings sheet
  var sheet = document.getElementById('sheet'), keyIn = document.getElementById('tmdb-key'), regIn = document.getElementById('region');
  var feedIn = document.getElementById('feed'), symIn = document.getElementById('symbols');
  function openSheet() { keyIn.value = tmdbKey(); regIn.value = region(); feedIn.value = load('hush.feed') || ''; symIn.value = load('hush.symbols') || ''; document.body.classList.add('settings'); zone = 'sheet'; keyIn.focus(); }
  function closeSheet(saveIt) {
    if (saveIt) { save('hush.tmdb', keyIn.value.trim()); save('hush.region', regIn.value.trim().toUpperCase() || 'IL'); save('hush.feed', feedIn.value.trim()); save('hush.symbols', symIn.value.trim()); listCache = {}; panelCache = {}; }
    document.body.classList.remove('settings'); zone = 'grid'; keyIn.blur(); regIn.blur(); setFocus(focus, 0, 0);
  }
  sheet.addEventListener('submit', function (e) { e.preventDefault(); closeSheet(true); });

  function press(el) { el.classList.add('pressed'); setTimeout(function () { el.classList.remove('pressed'); }, 120); }

  function a0(id) { return app(id); }
  function open(id, item) {
    if (a0(id).panel) { panelCache = {}; return showPanel(a0(id)); }
    if (id === 'settings') return TV.settings(function (ok, why) {
      if (ok) return;
      hint.textContent = 'TV settings: ' + (why || 'not available here') + ' — opening Hush settings'; hint.style.opacity = 1;
      setTimeout(function () { hint.style.opacity = ''; hint.textContent = ''; openSheet(); }, why ? 4000 : 0);
    });
    chime();
    var a = app(id);
    hint.textContent = 'Opening ' + a.name + (item ? ' · ' + item.title : '') + '…'; hint.style.opacity = 1;
    TV.launch(a, function (ok) {
      if (!ok) hint.textContent = a.name + ' is not installed on this TV';
      setTimeout(function () { hint.style.opacity = ''; hint.textContent = ''; }, ok ? 1200 : 2500);
    });
  }

  function bump() {
    if (onTv && document.body.classList.contains('idle')) { video.pause(); video.removeAttribute('src'); video.load(); }
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    clearTimeout(wildTimer);
    idleTimer = setTimeout(function () {
      document.body.classList.add('idle');
      showWild();
    }, IDLE_MS);
  }

  var BACK = { 27: 1, 8: 1, 10009: 1, 461: 1 }; // Esc / Backspace / Tizen Return / webOS Back
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (document.body.classList.contains('idle')) { e.preventDefault(); bump(); return; }
    if (zone === 'sheet') {
      if (BACK[k]) { e.preventDefault(); closeSheet(false); }
      else if (k === 40 || k === 38) {
        var fields = [keyIn, regIn, feedIn, symIn], at = fields.indexOf(document.activeElement);
        var to = fields[Math.max(0, Math.min(fields.length - 1, at + (k === 40 ? 1 : -1)))];
        if (to) { e.preventDefault(); to.focus(); }
      }
      bump(); return;
    }
    if (zone === 'pills') {
      e.preventDefault();
      if (k === 37) { setPill(pillFocus - 1); tick(); } else if (k === 39) { setPill(pillFocus + 1); tick(); }
      else if (k === 40 || BACK[k]) { leavePills(); if (slides.length && k === 40) { zone = 'shelf'; document.body.classList.add('zone-shelf'); rows.querySelectorAll('.icon').forEach(function (el) { el.classList.remove('is-focused', 'sway'); }); } }
      else if (k === 13) { tick(); pillAction(pills[pillFocus].getAttribute('data-act')); }
      bump(); return;
    }
    if (zone === 'shelf') {
      e.preventDefault();
      if (k === 38) { enterPills(); bump(); return; }
      if (k === 37) stepSlide(-1); else if (k === 39) stepSlide(1);
      else if (k === 40 || BACK[k]) { zone = 'grid'; document.body.classList.remove('zone-shelf'); setFocus(focus, 0, 0); }
      else if (k === 13) { press(document.getElementById('slides')); open(order[focus], slides[slide]); }
      bump(); return;
    }
    if (k === 38 && focus < PER_ROW && !slides.length) { e.preventDefault(); enterPills(); bump(); return; }
    if (k === 38 && focus < PER_ROW && slides.length) { // Up from the dock enters the shelf
      e.preventDefault(); zone = 'shelf'; document.body.classList.add('zone-shelf'); clearTimeout(swayTimer);
      rows.querySelectorAll('.icon').forEach(function (el) { el.classList.remove('is-focused', 'sway'); });
      bump(); return;
    }
    if (BACK[k]) {
      e.preventDefault();
      if (arranging) { arranging = false; document.body.classList.remove('arranging'); hint.textContent = ''; }
      else if (focus !== 0) setFocus(0, 0, 0);
      return;
    }
    if (k === 37) move(-1, 0); else if (k === 39) move(1, 0);
    else if (k === 38) move(0, -1); else if (k === 40) move(0, 1);
    else if (k === 13 && !e.repeat) {
      held = false;
      press(rows.querySelectorAll('.icon')[focus]);
      holdTimer = setTimeout(function () {
        held = true; arranging = true; document.body.classList.add('arranging');
        hint.textContent = 'Move with the arrows · Back when done';
      }, HOLD_MS);
    }
    bump();
  });
  document.addEventListener('keyup', function (e) {
    if (e.keyCode !== 13 || zone !== 'grid') return;
    clearTimeout(holdTimer);
    if (!held && !arranging) open(order[focus]);
  });
  document.addEventListener('mousemove', bump);

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById('stage').style.setProperty('--scale', s);
  }
  window.addEventListener('resize', fit); fit();

  function clockTick() {
    var n = new Date(), t = n.getHours() + ':' + ('0' + n.getMinutes()).slice(-2);
    var d = n.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('clock').textContent = t;
    document.getElementById('time').textContent = t; document.getElementById('cp-time').textContent = t;
    document.getElementById('date').textContent = d; document.getElementById('cp-date').textContent = d;
    document.getElementById('greet').textContent = greeting() + ', Trainer';
  }
  clockTick(); setInterval(clockTick, 10000);
  setMuted(muted);
  render();
  TV.installed(adoptInstalled);
  TV.sources(adoptSources);
  // no aerials here: the screensaver is the tall grass
  if (/idle/.test(location.hash)) { document.body.classList.add('idle'); showWild(); }

  console.assert(order.length === APPS.length, 'order covers every app');
  console.assert(rows.querySelectorAll('.row').length === Math.ceil(APPS.length / PER_ROW), 'rows match the grid');
})();
</script>
</body>
